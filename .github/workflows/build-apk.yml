name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test_and_build:
    name: Unit Test & Build APK (Android 8.0+)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Global unified cache across runs to maximize build performance
      - name: Cache Gradle Packages & Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-unified-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-unified-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # 1. Restore Signing Keystore from Base64
      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "Decoded keystore from GitHub Secrets."
          else
            echo "Generating fallback signing keystore..."
            keytool -genkeypair -v -keystore release-keystore.jks -alias vietkor-key -keyalg RSA -keysize 2048 -validity 10000 -storepass "vietkor2026SecureReleasePass!" -keypass "vietkor2026SecureReleasePass!" -dname "CN=VietKorDictionary, OU=Dev, O=VietKor, L=Hanoi, ST=Hanoi, C=VN"
          fi
          ls -lh release-keystore.jks

      # 2. Run Unit Tests BEFORE building APK
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Results
          path: app/build/reports/tests/
          retention-days: 7

      # 3. Build APKs (Debug & Signed Release)
      - name: Build Debug & Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'vietkor2026SecureReleasePass!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'vietkor-key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'vietkor2026SecureReleasePass!' }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # 4. Upload APK Artifacts
      - name: Upload APKs (Debug & Release)
        uses: actions/upload-artifact@v4
        with:
          name: VietnamKoreanDictionary-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      # 5. Prepare Standardized APK
      - name: Prepare Standardized APK
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk VietnamKoreanDictionary.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk VietnamKoreanDictionary.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk VietnamKoreanDictionary.apk
          fi
          ls -lh VietnamKoreanDictionary.apk

      # 6. Publish / Overwrite Beta Release with VietnamKoreanDictionary.apk
      - name: Publish Beta Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          target_commitish: ${{ github.sha }}
          name: "Vietnam Korean Dictionary (Beta Release)"
          body: |
            ## 🎉 Vietnam Korean Dictionary - Bản thử nghiệm (Beta)
            
            Bản dựng APK mới nhất được tự động biên dịch và kiểm thử qua GitHub Actions CI/CD.
            
            ### 📌 Thông tin bản phát hành:
            - **Tên tệp**: `VietnamKoreanDictionary.apk`
            - **Hệ điều hành hỗ trợ**: Android 8.0 Oreo trở lên (API 26+)
            - **Kho từ vựng**: 78.000 từ vựng ngoại tuyến (Room SQLite)
            - **Tìm kiếm thông minh**: Hỗ trợ tiếng Hàn, tiếng Việt không dấu, và phụ âm 초성
            - **AI Tutor & Gateway 2 Tầng**: Tầng 1 tối ưu hóa prompt; Tầng 2 hỗ trợ mô hình lớn ngoại tuyến (Qwen2.5-0.5B, SmolLM2-360M, Danube3-500M) chạy on-device và Cloud Gateway (Groq, Anthropic, Gemini, OpenAI)
            - **Hán tự & Hán-Việt**: Bảng gốc từ và quy luật chuyển âm
            - **Debug Console**: Máy chủ HTTP giám sát nội bộ (Cổng 8888)
            
            *(Tự động cập nhật và thay thế file `VietnamKoreanDictionary.apk` sau mỗi commit)*
          prerelease: true
          make_latest: true
          files: VietnamKoreanDictionary.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
